name: Initialize build environment
description: Install compilers, build tools, and system dependencies

runs:
  using: composite
  steps:
    - name: Initialize MSVC
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Install build tools (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        choco install ninja 7zip ccache --yes --no-progress
        if ($LASTEXITCODE -ne 0) { throw 'Build tool installation failed' }
        # vcpkg-make supplies an isolated MSYS2 environment for libmagic's Autotools build.

    - name: Select Xcode (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
        xcodebuild -version
        xcrun clang++ --version

    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS'
      shell: bash
      env:
        HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: '1'
        HOMEBREW_NO_INSTALL_CLEANUP: '1'
      run: |
        brew update
        brew install ninja ccache autoconf autoconf-archive automake libtool pkgconf bison flex libmagic
        echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
        echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"

    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential gcc-14 g++-14 ninja-build ccache patchelf zip unzip curl tar file binutils \
          autoconf autoconf-archive automake libtool libltdl-dev pkg-config \
          bison flex libmagic-dev
        echo 'CC=gcc-14' >> "$GITHUB_ENV"
        echo 'CXX=g++-14' >> "$GITHUB_ENV"
